<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page Not Found — Robuzta Tech Labs</title>
  <meta name="description"
    content="The page you were looking for couldn't be found. Return to the Robuzta Tech Labs homepage.">
  <meta name="robots" content="noindex, follow">
  <script>
    (() => {
      const key = "robuzta-theme";
      const theme =
        localStorage.getItem(key) ||
        (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
      document.documentElement.dataset.theme = theme;
      document
        .querySelector('meta[name="theme-color"]')
        ?.setAttribute("content", theme === "dark" ? "#0A0A0A" : "#FFFFFF");
    })();
  </script>
  <meta name="theme-color" content="#FFFFFF">
  <link rel="icon" type="image/svg+xml" href="assets/icons/favicon.svg">
  <link rel="stylesheet" href="assets/css/variables.css">
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/typography.css">
  <link rel="stylesheet" href="assets/css/layout.css">
  <link rel="stylesheet" href="assets/css/utilities.css">
  <link rel="stylesheet" href="assets/css/themes.css">
  <link rel="stylesheet" href="assets/css/animations.css">
  <link rel="stylesheet" href="assets/css/buttons.css">
  <link rel="stylesheet" href="assets/css/header.css">
  <link rel="stylesheet" href="assets/css/footer.css">
  <style>
    .error-page {
      min-height: 80vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: var(--space-8) var(--space-4);
    }

    .error-code {
      font-size: clamp(100px, 20vw, 200px);
      font-weight: var(--fw-black);
      line-height: 1;
      background: linear-gradient(135deg, var(--accent), var(--clr-blue-electric));
      -webkit-background-clip: text;
      -webkit-text-fill-color: var(--text-primary);
      background-clip: text;
      margin-bottom: var(--space-4);
    }

    .error-animation {
      display: flex;
      justify-content: center;
      align-items: center;
      margin-bottom: var(--space-5);
    }

    .error-animation svg {
      animation: spin-slow 12s linear infinite;
    }

    @keyframes spin-slow {
      from {
        transform: rotate(0deg)
      }

      to {
        transform: rotate(360deg)
      }
    }

    .error-gear-center {
      animation: spin-slow 8s linear infinite reverse;
      transform-origin: 50% 50%;
    }
  </style>
</head>

<body>
  <main id="main-content">
    <div class="error-page">
      <!-- Animated SVG illustration -->
      <div class="error-animation" aria-hidden="true">
        <svg width="160" height="160" viewBox="0 0 160 160">
          <!-- Outer ring -->
          <circle cx="80" cy="80" r="70" stroke="var(--border-color)" stroke-width="2" fill="none" />
          <!-- Gear outer -->
          <g transform="translate(80,80)">
            <svg x="-40" y="-40" width="80" height="80" viewBox="0 0 24 24">
              <path fill="var(--text-primary)" opacity="0.25"
                d="M19.14,12.94c0.04-0.3,0.06-0.61,0.06-0.94c0-0.32-0.02-0.64-0.07-0.94l2.03-1.58c0.18-0.14,0.23-0.41,0.12-0.61 l-1.92-3.32c-0.12-0.22-0.37-0.29-0.59-0.22l-2.39,0.96c-0.5-0.38-1.03-0.7-1.62-0.94L14.4,2.81c-0.04-0.24-0.24-0.41-0.48-0.41 h-3.84c-0.24,0-0.43,0.17-0.47,0.41L9.25,5.35C8.66,5.59,8.12,5.92,7.63,6.29L5.24,5.33c-0.22-0.08-0.47,0-0.59,0.22L2.74,8.87 C2.62,9.08,2.66,9.34,2.86,9.48l2.03,1.58C4.84,11.36,4.8,11.69,4.8,12s0.02,0.64,0.07,0.94l-2.03,1.58 c-0.18,0.14-0.23,0.41-0.12,0.61l1.92,3.32c0.12,0.22,0.37,0.29,0.59,0.22l2.39-0.96c0.5,0.38,1.03,0.7,1.62,0.94l0.36,2.54 c0.05,0.24,0.24,0.41,0.48,0.41h3.84c0.24,0,0.44-0.17,0.47-0.41l0.36-2.54c0.59-0.24,1.13-0.56,1.62-0.94l2.39,0.96 c0.22,0.08,0.47,0,0.59-0.22l1.92-3.32c0.12-0.22,0.07-0.47-0.12-0.61L19.14,12.94z M12,15.6c-1.98,0-3.6-1.62-3.6-3.6 s1.62-3.6,3.6-3.6s3.6,1.62,3.6,3.6S13.98,15.6,12,15.6z" />
            </svg>
          </g>
        </svg>
      </div>

      <div class="error-code" aria-label="Error 404">404</div>
      <h1 style="font-size:var(--fs-600);margin-bottom:var(--space-3);">Page Not Found</h1>
      <p style="color:var(--text-muted);font-size:var(--fs-400);max-width:520px;margin-bottom:var(--space-6)">The page
        you're looking for may have been moved, renamed, or might never have existed. Navigate to a known page.</p>
      <div style="display:flex;gap:var(--space-3);justify-content:center;flex-wrap:wrap;">
        <a href="index.html" class="btn btn--primary" aria-label="Go to homepage">Go to Homepage</a>
        <a href="contact.html" class="btn btn--outline" aria-label="Contact us">Book a Repair</a>
      </div>
    </div>
  </main>

  <div class="custom-cursor" aria-hidden="true"></div>
  <div class="custom-cursor-follower" aria-hidden="true"></div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"
    onerror="this.onerror=null;this.src='assets/vendor/gsap.min.js';"></script>
  <script type="module" src="assets/js/theme.js"></script>
  <script type="module" src="assets/js/utils.js"></script>
</body>

</html>
